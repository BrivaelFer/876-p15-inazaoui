services:
  db:
    image: postgres:15-alpine
    container_name: ina_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ina_zaoui
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - symfony_network

volumes:
  postgres_data:

networks:
  symfony_network:
    driver: bridge